services:
  food-safety:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/food-safety.sqlite
    volumes:
      - food-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  food-data:
